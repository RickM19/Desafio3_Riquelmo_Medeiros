services:
    app:
        build: .
        container_name: compasscar-app
        entrypoint: .docker/entrypoint.sh
        ports:
            - '3000:3000'
        volumes:
            - .:/home/node/app
        depends_on:
            db:
                condition: service_healthy

    db:
        build: .docker/postgres
        container_name: compasscar-db
        restart: always
        tty: true
        ports:
            - '5432:5432'
        volumes:
            - .docker/dbdata:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=aefb3ai
            - POSTGRES_DB=compasscarbd
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 10s
            retries: 5
            start_period: 30s
            timeout: 5s
